name: 1. Generate Prompt
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate dreamscape prompt
        run: python src/generate_prompt.py
      - name: Commit
        run: |
          git config user.name "paradise-bot"
          git config user.email "bot@paradise"
          git add data/tracking.json
          git diff --cached --quiet || (git commit -m "New dreamscape prompt" && git push)
