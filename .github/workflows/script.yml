name: Write Script

on:
  workflow_dispatch: {}
  workflow_run:
    workflows: ["Research Fact"]
    types: [completed]

permissions:
  contents: write

jobs:
  write-script:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run script module
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python src/script/write_script.py

      - name: Commit updated tracking file
        run: |
          git config user.name "aether-bot"
          git config user.email "aether-bot@users.noreply.github.com"
          git add data/tracking/facts.json
          git diff --cached --quiet || git commit -m "Add script for pending fact"
          git push
