name: Render Video

on:
  workflow_dispatch: {}
  workflow_run:
    workflows: ["Fetch Visuals"]
    types: [completed]

permissions:
  contents: write

jobs:
  render:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Run render module
        run: python src/render/render_video.py

      - name: Commit rendered video + updated tracking file
        run: |
          git config user.name "aether-bot"
          git config user.email "aether-bot@users.noreply.github.com"
          git lfs track "data/render/*.mp4" 2>/dev/null || true
          git add data/tracking/facts.json data/render/
          git diff --cached --quiet || git commit -m "Render final video for pending fact"
          git push
