name: 2. Generate Image
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate AI image
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python src/generate_image.py
      - name: Commit
        run: |
          git config user.name "paradise-bot"
          git config user.email "bot@paradise"
          git add data/tracking.json data/images/
          git diff --cached --quiet || (git commit -m "Generated image" && git push)
