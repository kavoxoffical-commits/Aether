name: 4. Select Audio
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Select ambient sounds
        run: python src/select_audio.py
      - name: Commit
        run: |
          git config user.name "paradise-bot"
          git config user.email "bot@paradise"
          git add data/tracking.json
          git diff --cached --quiet || (git commit -m "Selected audio" && git push)
