name: 3. Add Motion
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  motion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Add motion effects
        run: python src/add_motion.py
      - name: Commit
        run: |
          git config user.name "paradise-bot"
          git config user.email "bot@paradise"
          git add data/tracking.json data/render/
          git diff --cached --quiet || (git commit -m "Added motion" && git push)
