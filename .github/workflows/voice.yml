name: Generate Voice

on:
  workflow_dispatch: {}
  workflow_run:
    workflows: ["Write Script"]
    types: [completed]

permissions:
  contents: write

jobs:
  generate-voice:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run voice module
        run: python src/voice/generate_voice.py

      - name: Commit audio + updated tracking file
        run: |
          git config user.name "aether-bot"
          git config user.email "aether-bot@users.noreply.github.com"
          git add data/tracking/facts.json data/audio/
          git diff --cached --quiet || git commit -m "Add voiceover for pending fact"
          git push
